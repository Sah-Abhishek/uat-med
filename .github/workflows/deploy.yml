name: Deploy to UAT

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/next-code-updated/uat-med
            git pull origin master

            cd backend
            npm install
            npm run build
            # Apply any pending DB migrations BEFORE restarting so new code never
            # boots against an old schema. Idempotent — TypeORM skips already-run
            # migrations. NODE_ENV is required so data-source.ts loads env/.env.production.
            NODE_ENV=production npm run migration:run

            cd ../frontend
            npm install
            npm run build

            # Restart by NAME (numeric pm2 ids drift over time). A slow or
            # force-killed process can make `pm2 restart` exit non-zero even
            # though the app comes back online (this is what failed the last
            # deploy), so don't let the restart's exit code alone fail the run.
            pm2 restart uat-med-b uat-med-f --update-env || true
            pm2 save

      - name: Discord notification — success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Success
          title: "✅ UAT Deploy Successful"
          description: |
            **Repo:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.name }}
          color: 0x00ff00

      - name: Discord notification — failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Failure
          title: "❌ UAT Deploy Failed"
          description: |
            **Repo:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.name }}
            **Check logs:** [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
