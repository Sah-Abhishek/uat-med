# Serves the built SPA and reverse-proxies the two same-origin backends the
# frontend expects (mirrors the proxy block in vite.config.ts):
#   /api/v1  -> the NestJS API container
#   /icd-bot -> the external ICD-10-CM assistant bot (prefix stripped)
#
# `backend` resolves over the compose network; compose `depends_on` waits for it
# to be healthy before this container starts, so startup resolution succeeds.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't cap clinical-document / bulk uploads at nginx's 1m default.
    client_max_body_size 50m;

    # ── API → NestJS backend (keep the /api/v1 prefix; backend sets it globally) ──
    location /api/v1/ {
        proxy_pass http://backend:2500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── ICD-10-CM assistant bot (strip /icd-bot, like the vite rewrite) ──
    location /icd-bot/ {
        proxy_pass http://216.48.183.162:6334/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── SPA: hashed assets cache hard; everything else falls back to index.html ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
